<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f4f6" />
  <title>MarkToast</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <script>
    try {
      var pref = localStorage.getItem("marktoast-theme") || "auto";
      var dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <defs>
      <linearGradient id="toastGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFD978"/>
        <stop offset="1" stop-color="#F1B747"/>
      </linearGradient>
    </defs>
    <symbol id="icon-logo" viewBox="0 0 20 20">
      <path d="M10 17.4H15.2C16.5 17.4 17.4 16.5 17.4 15.2V7.2C17.4 4.6 15.7 2.9 13.1 2.9H6.9C4.3 2.9 2.6 4.6 2.6 7.2V15.2C2.6 16.5 3.5 17.4 4.8 17.4H10" fill="url(#toastGrad)" stroke="#C98B2E" stroke-width="1.15" stroke-linejoin="round"/>
      <path d="M5 13.1V8.9l2.5 2.8 2.5-2.8v4.2" fill="none" stroke="#5A3A12" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.8 9.2v3.1m0 0 1.2-1.2m-1.2 1.2-1.2-1.2" fill="none" stroke="#5A3A12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 20 20">
      <circle cx="8.7" cy="8.7" r="5.2"></circle>
      <path d="m12.6 12.6 4 4"></path>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 20 20">
      <path d="M10 4v12M4 10h12"></path>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 20 20">
      <path d="M16.5 8.2A7 7 0 0 0 4.2 5.8L2.8 7.2M2.8 3.8v3.4h3.4M3.5 11.8a7 7 0 0 0 12.3 2.4l1.4-1.4M17.2 16.2v-3.4h-3.4"></path>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 20 20">
      <path d="M3.5 6.2h7.3M3.5 10h2.3M3.5 13.8h7.3M14.2 6.2h2.3M10.8 10h5.7M14.2 13.8h2.3"></path>
      <circle cx="12.3" cy="6.2" r="1.5"></circle>
      <circle cx="7.3" cy="10" r="1.5"></circle>
      <circle cx="12.3" cy="13.8" r="1.5"></circle>
    </symbol>
    <symbol id="icon-stack" viewBox="0 0 20 20">
      <path d="m10 2.8 7 3.4-7 3.4-7-3.4 7-3.4Z"></path>
      <path d="m3 10.3 7 3.4 7-3.4M3 14.2l7 3.3 7-3.3"></path>
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 20 20">
      <path d="M2.5 5.3h5l1.6 1.6h8.4v8.6h-15V5.3Z"></path>
    </symbol>
    <symbol id="icon-plug" viewBox="0 0 20 20">
      <path d="M6.7 9.2h6.6v2.9a3.3 3.3 0 0 1-6.6 0V9.2ZM7.5 3.5v4M12.5 3.5v4M10 15.4v1.5"></path>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="7"></circle>
      <path d="M10 6v4.3l2.8 1.7"></path>
    </symbol>
    <symbol id="icon-branch" viewBox="0 0 20 20">
      <circle cx="5.8" cy="4.5" r="1.5"></circle>
      <circle cx="14.2" cy="6.2" r="1.5"></circle>
      <circle cx="5.8" cy="15.5" r="1.5"></circle>
      <path d="M5.8 6v8M7.2 8.2h2.3a4.7 4.7 0 0 0 4.7-2"></path>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 20 20">
      <path d="M5 2.5h6.3l3.7 3.7v11.3H5V2.5Z"></path>
      <path d="M11.3 2.5v3.7H15M7.5 10h5M7.5 13h5"></path>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 20 20">
      <path d="m7.8 5.5 4.5 4.5-4.5 4.5"></path>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 20 20">
      <path d="m5.5 7.8 4.5 4.5 4.5-4.5"></path>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 20 20">
      <rect x="6.5" y="6.5" width="9" height="9" rx="1.5"></rect>
      <path d="M13 6.5V4.8A1.3 1.3 0 0 0 11.7 3.5H4.8A1.3 1.3 0 0 0 3.5 4.8v6.9A1.3 1.3 0 0 0 4.8 13H6.5"></path>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 20 20">
      <path d="m5 5 10 10M15 5 5 15"></path>
    </symbol>
    <symbol id="icon-warning" viewBox="0 0 20 20">
      <path d="M10 2.5 2.2 16.7h15.6L10 2.5Z"></path>
      <path d="M10 7v4.5M10 14.5v.1"></path>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 20 20">
      <path d="m4 10.2 3.6 3.6L16 6.3"></path>
    </symbol>
    <symbol id="icon-terminal" viewBox="0 0 20 20">
      <rect x="2.5" y="3.5" width="15" height="13" rx="1.6"></rect>
      <path d="m6 7 2.5 2.5L6 12M10.5 12.5H14"></path>
    </symbol>
  </svg>

  <aside class="sidebar" id="sidebar" aria-label="记忆仓库导航">
    <div class="side-top">
      <svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><use href="#icon-logo"></use></svg>
      <span class="side-brand-name">Mark<b>Toast</b></span>
    </div>
    <div class="side-scroll">
      <section class="side-group" aria-labelledby="library-label">
        <div class="side-label" id="library-label">记忆</div>
        <button class="side-row is-active" id="all-memories" type="button">
          <svg class="ic"><use href="#icon-stack"></use></svg>
          <span class="side-name">全部记忆</span>
          <span class="side-count" id="all-count">—</span>
        </button>
        <button class="side-row" type="button" data-view="adapters">
          <svg class="ic"><use href="#icon-plug"></use></svg>
          <span class="side-name">适配器</span>
        </button>
        <button class="side-row" type="button" data-view="history">
          <svg class="ic"><use href="#icon-branch"></use></svg>
          <span class="side-name">历史</span>
        </button>
      </section>

      <section class="side-group" aria-labelledby="projects-label">
        <div class="side-label-row">
          <div class="side-label" id="projects-label">项目</div>
          <span class="side-label-count" id="project-total">—</span>
        </div>
        <div class="project-list" id="project-list">
          <div class="skeleton side-skeleton"></div>
          <div class="skeleton side-skeleton short"></div>
        </div>
      </section>
    </div>
    <div class="side-foot">
      <button class="side-foot-row side-foot-link" type="button" data-view="settings">
        <svg class="ic"><use href="#icon-settings"></use></svg>
        <span>设置</span>
      </button>
      <div class="side-foot-row" id="repo-status" title="">
        <span class="status-dot" id="side-status-dot"></span>
        <span id="hub-state-text">连接中</span>
        <span class="side-count" id="repo-count"></span>
      </div>
    </div>
  </aside>

  <header class="top">
    <a class="brand compact-brand" href="#" aria-label="MarkToast 首页">
      <svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><use href="#icon-logo"></use></svg>
      <span class="brand-name">Mark<b>Toast</b></span>
    </a>
    <div class="breadcrumb" id="breadcrumb" aria-label="当前位置">
      <span>记忆库</span>
      <i aria-hidden="true">/</i>
      <b id="breadcrumb-current">全部记忆</b>
    </div>

    <nav class="seg" id="main-nav" aria-label="主导航">
      <span class="thumb" id="seg-thumb" aria-hidden="true"></span>
      <button class="on" type="button" data-view="memories" aria-current="page">记忆</button>
      <button type="button" data-view="adapters">适配器</button>
      <button type="button" data-view="history">历史</button>
    </nav>

    <div class="top-actions">
      <div class="search-shell" id="search-shell">
        <button class="icon search-toggle" id="search-toggle" type="button" aria-label="搜索" title="搜索">
          <svg class="ic"><use href="#icon-search"></use></svg>
        </button>
        <input id="global-search" type="search" placeholder="搜索" autocomplete="off" spellcheck="false" aria-label="搜索记忆" tabindex="-1" />
        <button class="search-clear" id="search-clear" type="button" aria-label="清空搜索" hidden>
          <svg class="ic"><use href="#icon-close"></use></svg>
        </button>
      </div>
      <button class="icon" id="refresh-view" type="button" aria-label="刷新当前视图" title="刷新">
        <svg class="ic"><use href="#icon-refresh"></use></svg>
      </button>
      <button class="icon top-settings" id="open-settings" data-view="settings" type="button" aria-label="设置" title="设置">
        <svg class="ic"><use href="#icon-settings"></use></svg>
      </button>
    </div>
  </header>

  <main class="view">
    <div class="view-inner">
      <div class="hub-alert" id="hub-alert" role="alert" hidden>
        <svg class="ic"><use href="#icon-warning"></use></svg>
        <span id="hub-alert-text">无法连接本地 hub。</span>
        <button class="text-button" id="retry-hub" type="button">重试</button>
      </div>

      <section class="view-panel" id="view-memories" role="tabpanel" aria-label="记忆">
        <div class="view-head">
          <h1 id="memory-heading">全部记忆</h1>
          <div class="view-head-actions">
            <span class="view-count" id="result-total" aria-live="polite">—</span>
            <button class="button primary compact" id="new-memory-top" type="button">
              <svg class="ic"><use href="#icon-plus"></use></svg>
              <span>新建</span>
            </button>
          </div>
        </div>

        <div class="filters" aria-label="记忆筛选">
          <label class="filter-control">
            <select id="project-filter" aria-label="项目筛选">
              <option value="">全部项目</option>
            </select>
            <svg class="ic"><use href="#icon-chevron-down"></use></svg>
          </label>
          <label class="filter-control">
            <select id="type-filter" aria-label="类型筛选">
              <option value="">全部类型</option>
              <option value="user">用户</option>
              <option value="feedback">反馈</option>
              <option value="project">项目</option>
              <option value="reference">参考</option>
            </select>
            <svg class="ic"><use href="#icon-chevron-down"></use></svg>
          </label>
          <div class="filter-push"></div>
          <button class="filter-control sort-control" id="sort-button" type="button" aria-label="切换排序">
            <b id="sort-label">相关度</b>
            <svg class="ic"><use href="#icon-chevron-down"></use></svg>
          </button>
        </div>

        <div id="memory-results" aria-live="polite" aria-busy="true">
          <div class="list">
            <div class="row loading-row"><span class="skeleton title"></span><span class="skeleton line"></span></div>
            <div class="row loading-row"><span class="skeleton title short"></span><span class="skeleton line"></span></div>
            <div class="row loading-row"><span class="skeleton title"></span><span class="skeleton line"></span></div>
          </div>
        </div>
      </section>

      <section class="view-panel" id="view-adapters" role="tabpanel" aria-label="适配器" hidden>
        <div class="view-head">
          <h1>适配器</h1>
          <span class="view-count" id="adapter-count">—</span>
        </div>
        <div id="adapter-results" aria-live="polite"></div>
      </section>

      <section class="view-panel" id="view-history" role="tabpanel" aria-label="历史" hidden>
        <div class="view-head">
          <h1>历史</h1>
        </div>
        <div id="history-results" aria-live="polite"></div>
      </section>

      <section class="view-panel" id="view-settings" role="tabpanel" aria-label="设置" hidden>
        <div class="view-head">
          <h1>设置</h1>
        </div>
        <div class="settings-stack">
          <section class="settings-card">
            <h2>外观</h2>
            <div class="theme-switch" id="theme-switch" role="group" aria-label="主题">
              <button type="button" data-theme-choice="auto">跟随系统</button>
              <button type="button" data-theme-choice="light">浅色</button>
              <button type="button" data-theme-choice="dark">深色</button>
            </div>
          </section>

          <section class="settings-card">
            <h2>仓库</h2>
            <div class="settings-row">
              <span class="settings-label">根目录</span>
              <code class="settings-value" id="settings-root">—</code>
              <button class="icon" id="copy-root" type="button" aria-label="复制根目录" title="复制">
                <svg class="ic"><use href="#icon-copy"></use></svg>
              </button>
            </div>
            <div class="settings-row">
              <span class="settings-label">记忆</span>
              <span class="settings-value" id="settings-facts">—</span>
            </div>
            <div class="settings-row">
              <span class="settings-label">索引</span>
              <span class="settings-value" id="settings-index">—</span>
              <button class="button quiet" id="reindex" type="button">重建索引</button>
            </div>
          </section>

          <section class="settings-card">
            <h2>MCP</h2>
            <div class="settings-row">
              <span class="settings-label">Token</span>
              <code class="settings-value" id="settings-token">—</code>
              <button class="icon" id="copy-token" type="button" aria-label="复制 MCP token" title="复制">
                <svg class="ic"><use href="#icon-copy"></use></svg>
              </button>
            </div>
          </section>

          <section class="settings-card">
            <h2>导入</h2>
            <div class="settings-row">
              <span class="settings-label">ZCode</span>
              <code class="settings-value">~/.zcode/cli/memories</code>
              <button class="button quiet" type="button" data-import="zcode">导入</button>
            </div>
            <div class="settings-row">
              <span class="settings-label">Hermes</span>
              <code class="settings-value">~/.hermes</code>
              <button class="button quiet" type="button" data-import="hermes">导入</button>
            </div>
          </section>

          <section class="settings-card">
            <h2>项目别名</h2>
            <div class="alias-list" id="alias-list"></div>
            <div class="settings-foot">
              <button class="button primary" id="save-aliases" type="button">保存</button>
            </div>
          </section>
        </div>
      </section>

    </div>
  </main>

  <div class="modal" id="memory-modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <form id="memory-form">
        <header class="dialog-head">
          <div class="dialog-title-wrap">
            <svg class="logo"><use href="#icon-logo"></use></svg>
            <h2 id="dialog-title">新建记忆</h2>
          </div>
          <button class="icon" id="close-dialog" type="button" aria-label="关闭新建记忆弹层">
            <svg class="ic"><use href="#icon-close"></use></svg>
          </button>
        </header>
        <div class="dialog-body">
          <div class="form-grid">
            <label class="field">
              <span>项目</span>
              <input id="memory-project" name="project" required placeholder="feedsieve" autocomplete="off" />
            </label>
            <label class="field">
              <span>类型</span>
              <select id="memory-type" name="type" required>
                <option value="project">项目</option>
                <option value="user">用户</option>
                <option value="feedback">反馈</option>
                <option value="reference">参考</option>
              </select>
            </label>
          </div>
          <label class="field">
            <span>名称</span>
            <input id="memory-name" name="name" required placeholder="fact-name" autocomplete="off" />
          </label>
          <label class="field">
            <span>描述</span>
            <input id="memory-description" name="description" placeholder="为搜索补充一点上下文" autocomplete="off" />
          </label>
          <label class="field">
            <span>正文</span>
            <textarea id="memory-body" name="body" required rows="10" placeholder="写下这条记忆…"></textarea>
          </label>
          <p class="form-error" id="form-error" role="alert" hidden></p>
        </div>
        <footer class="dialog-foot">
          <div class="dialog-actions">
            <button class="button quiet" id="cancel-dialog" type="button">取消</button>
            <button class="button primary" id="submit-memory" type="submit">
              <svg class="ic"><use href="#icon-check"></use></svg>
              <span>保存</span>
            </button>
          </div>
        </footer>
      </form>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
