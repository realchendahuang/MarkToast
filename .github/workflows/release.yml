name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-app:
    name: macOS app (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel, each on its own runner so the app bundle
          # matches the runner's architecture (the script names the asset).
          # macos-13 was retired in Dec 2025; macos-15-intel is the x86_64 label
          # (Intel Mac support itself runs until Fall 2027).
          - runner: macos-15
          - runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # There is no Developer ID in CI, so the bundle is ad-hoc signed: it
      # verifies with codesign but Gatekeeper still asks the reader to allow it.
      - name: Package the desktop app
        env:
          ALLOW_UNSIGNED: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make release VERSION="$VERSION"

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: |
            dist/MarkToast-*.zip
            dist/MarkToast-*.dmg
          if-no-files-found: error

  cli:
    name: CLI ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="marktoast-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          mkdir -p "dist/$NAME"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
              -ldflags "-s -w -X github.com/realchendahuang/MarkToast/internal/version.Version=${VERSION}" \
              -o "dist/$NAME/marktoast${EXT}" ./cmd/marktoast
          cp LICENSE README.md "dist/$NAME/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -q -r "$NAME.zip" "$NAME")
          else
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          fi
          rm -rf "dist/$NAME"

      - name: Upload the CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/marktoast-*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [macos-app, cli]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect the artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums
        run: |
          cd dist
          ls -la
          sha256sum MarkToast-*.zip MarkToast-*.dmg marktoast-*.tar.gz marktoast-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Not a prerelease on purpose: `marktoast update` reads
          # /releases/latest, which GitHub skips for prereleases.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MarkToast ${VERSION} — pre-alpha" \
            --notes-file .github/release-notes.md
