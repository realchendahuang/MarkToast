name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and verify (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Go modules
        run: go mod download

      - name: Verify Go module checksums
        run: go mod verify

      - name: Format, tidy, vet, race test, and build
        run: make fmt-check tidy-check vet test-race build

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/i18n.js
          node --check frontend/theme-init.js

      - name: Check shell script syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/release.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/install.sh scripts/release.sh
          fi

  macos-desktop:
    name: Build macOS desktop
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build Wails desktop app with CGO
        env:
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: make desktop

      - name: Verify desktop binary
        run: test -x bin/marktoast-desktop
