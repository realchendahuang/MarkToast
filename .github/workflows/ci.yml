name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and verify (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Go modules
        run: go mod download

      - name: Verify Go module checksums
        run: go mod verify

      # The desktop shell imports Wails v3, whose Linux backend needs GTK4 and
      # webkitgtk-6.0 development headers that the runner does not carry. It is
      # macOS-only for now anyway, so the cross-platform packages are vetted,
      # raced and built here and the shell is left to the macOS job below.
      - name: Format and module checks
        run: make fmt-check tidy-check

      - name: Vet the cross-platform packages
        run: |
          packages="$(go list ./... | grep -v 'cmd/marktoast-desktop')"
          go vet $packages

      - name: Race tests
        run: |
          packages="$(go list ./... | grep -v 'cmd/marktoast-desktop')"
          go test -race $packages

      - name: Build the CLI
        run: go build ./cmd/marktoast

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/i18n.js
          node --check frontend/theme-init.js

      - name: Check shell script syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/release.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/install.sh scripts/release.sh
          fi

  macos-desktop:
    name: Build macOS desktop
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build Wails desktop app with CGO
        env:
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: make desktop

      - name: Verify desktop binary
        run: test -x bin/marktoast-desktop
