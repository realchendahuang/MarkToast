id: hermes
title: Hermes Agent
detect:
  - ~/.hermes
instruction_file:
  global: ~/.hermes/SOUL.md
  project: ""
  marker: "<!-- marktoast:begin -->"
native_memory:
  root: ~/.hermes/memories
  index: MEMORY.md
hooks:
  events:
    - on_session_start
    - pre_llm_call
    - pre_tool_call
    - post_tool_call
    - on_session_end
    - on_session_finalize
  install_kind: yaml_snippet
  schema: yaml
  scope: global
  target: ~/.hermes/config.yaml
  injection: pre_llm_call_context
  needs_trust: true
  notes: "ai-memory 从不写 ~/.hermes/config.yaml（只打印 hooks: 块），且 Hermes 用 hooks_auto_accept / shell-hooks-allowlist.json 门控 user hooks；每个 profile 是独立 home，需各自 accept。6 个事件、20s 超时，command 用 shlex.split 无 shell。Hermes 忽略 on_session_start 输出，handoff 要在 pre_llm_call 打印 {\"context\": ...}（resume 后也生效）；on_session_end 是回合边界，on_session_finalize 才是会话结束。依据：docs/install.md#Hermes-Agent-Nous-Research；docs/mcp-install.md#Hermes Agent；render_shared.rs: HERMES_TOOL_EVENTS/HERMES_LIFECYCLE_EVENTS；install_hooks.rs: hermes 分支。"
mcp:
  kind: stdio_bridge
  target: ~/.hermes/config.yaml
  shape: mcp_servers
  notes: "mcp_servers 支持 stdio 与 HTTP/Streamable HTTP；install-mcp --client hermes 只打印条目（--apply 拒绝）：stdio 跑 ai-memory mcp-bridge --no-session-id 并带 --data-dir；Hermes 不读 MCP server instructions。仅 MCP = 只有工具调用，无 prefetch/sync_turn 生命周期。依据：docs/mcp-install.md#Hermes Agent。"
session:
  roots:
    - ~/.hermes/state.db
  format: sqlite
  notes: "会话导出优先 `hermes sessions export --format jsonl`；Markdown 是渲染格式，不是无损回导格式。"
session_logs: ~/.hermes/state.db
tier: native
capabilities:
  - read
  - write
  - inject
  - mcp
install_mode: staged
docs:
  - ai-memory/docs/support-matrix.md#Hermes Agent
  - ai-memory/docs/install.md#Hermes-Agent-Nous-Research
  - ai-memory/docs/mcp-install.md#Hermes Agent
notes: "内置 MEMORY.md/USER.md 用精确 \"\\n§\\n\" 分隔，2200/1375 字符预算；完整 preload/turn sync 需实现 standalone MemoryProvider 并关闭内置写入以避免双写。"
