id: qoder
title: Qoder
detect:
  - ~/.qoder
instruction_file:
  global: ""
  project: "{workspace}/AGENTS.md"
  marker: "<!-- marktoast:begin -->"
native_memory:
  root: ""
  index: ""
hooks:
  events:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - PostToolUseFailure
    - PreCompact
    - Stop
    - SessionEnd
  install_kind: json_merge
  schema: claude
  scope: global
  target: ~/.qoder/settings.json
  injection: stdout_additional_context
  needs_trust: false
  notes: "hooks 在 ~/.qoder/settings.json 的 hooks 键（可与项目 .qoder/settings.json 同构）；8 个事件，payload 为 Claude 形（session_id/cwd/tool_name/tool_input/tool_use_id）。SessionStart 经 hookSpecificOutput.additionalContext 注入 handoff，缺 cwd 时回退 QODER_PROJECT_DIR；改 hooks 后需重启 Qoder。依据：docs/mcp-install.md#Qoder；render_shared.rs: QODER_EVENTS；install_hooks.rs: qoder_settings_path。"
mcp:
  kind: stdio_bridge
  target: ~/.qoder/settings.json
  shape: mcpServers
  notes: "mcpServers 里写 sessionless 的 ai-memory mcp-bridge --no-session-id（stdio command/args/env），避免第二个 server 进程争 data-dir 锁；project-scoped 调用需显式传 workspace/project。依据：docs/mcp-install.md#Qoder。"
session:
  roots: []
  format: unknown
  notes: "Qoder 无文档化稳定 native transcript-store 契约（无 backfill / managed adapter）。依据：docs/mcp-install.md#Qoder。"
tier: projection
capabilities:
  - read
  - inject
  - mcp
install_mode: auto
docs:
  - ai-memory/docs/support-matrix.md#Qoder
  - ai-memory/docs/mcp-install.md#Qoder
  - https://docs.qoder.com/cli/hooks
notes: "Qoder CLI 与 IDE 共享 ~/.qoder；读 AGENTS.md 与共享 ~/.agents/skills，routing/skills 无需 Qoder 专属副本。"
